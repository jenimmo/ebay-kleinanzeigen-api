[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebay-kleinanzeigen-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.MD"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.15",
    "aiosqlite>=0.21.0",
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "mcp>=2.0.0,<3.0.0",
    "playwright>=1.49.0",
    "pillow>=11.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34.0",
    "uvloop>=0.21.0",
]

[dependency-groups]
dev = [
    "mcp[cli]>=2.0.0,<3.0.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff==0.15.14",
]

[project.scripts]
kleinanzeigen-mcp = "kleinanzeigen_mcp.stdio:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = ["--strict-markers", "-ra"]
python_files = ["test_*.py", "simple_test.py"]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: requires a running API server and may access Kleinanzeigen over the network (enable with --run-live)",
    "live_messaging: sends messages only between configured own accounts with server test mode (enable separately with --run-live-messaging)",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kleinanzeigen_mcp*", "libs*", "messaging*", "routers*", "scrapers*", "utils*"]
exclude = ["tests*"]
namespaces = true
